<style>

*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{flex:1;min-width:0;margin:0;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
#login{max-width:380px;margin:12vh auto}input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0 12px;font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
